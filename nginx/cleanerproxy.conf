# nginx front end for cleanerproxy.
#
# The settings below are not cosmetic. A default nginx reverse-proxy config
# will buffer the upstream response, which destroys SSE streaming and makes
# every agent interaction appear to hang until the response completes. The
# proxy_buffering/proxy_request_buffering directives here are required, not
# optional tuning.

upstream cleanerproxy {
    server cleanerproxy:8787;
    keepalive 32;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # LLM requests carry entire file contents and long conversations.
    client_max_body_size 64m;

    # Do not buffer the request body to disk before forwarding; it adds
    # latency and writes prompt content to the filesystem unnecessarily.
    client_body_buffer_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://cleanerproxy;
        proxy_http_version 1.1;

        # --- streaming correctness (required) ---------------------------
        # Without these, nginx accumulates the SSE response and releases it
        # in chunks, so tool calls and text arrive in bursts or not until the
        # turn ends.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # SSE needs a plain keep-alive connection, not an Upgrade.
        proxy_set_header Connection "";

        # A model generating a long response can legitimately exceed any
        # short read timeout. This is the single most common cause of
        # mysteriously truncated streams behind a reverse proxy.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://cleanerproxy;
        access_log off;
    }
}
