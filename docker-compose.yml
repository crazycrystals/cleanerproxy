# Docker deployment (alternative to native `go run ./cmd/cleanerproxy`).
#
# The primary run mode is now native macOS with oMLX for Tier 2 classification.
# This compose file is kept for containerised deployments where colima or Docker
# Desktop is available and the guardian sidecar is preferred over oMLX.
#
# Native run (preferred):
#   source .env && go run ./cmd/cleanerproxy
#   (requires oMLX running with granite-guardian-3.2-3b-a800m-4bit loaded)
#
# Docker run:
#   docker compose up -d
#   (builds the guardian container with llama.cpp; no oMLX needed)
services:
  # Tier 2 classifier: IBM Granite Guardian on llama.cpp.
  #
  # Deliberately on an internal-only network. It needs no internet access, and
  # denying it any means that even a compromised inference server cannot
  # exfiltrate the conversation content it inspects.
  guardian:
    build: ./guardian
    restart: unless-stopped
    networks: [classifier]
    environment:
      GUARDIAN_MODEL: /models/granite-guardian-3.2-3b-a800m.gguf
      # Published by IBM at registry.ollama.ai/v2/ibm/granite3.2-guardian (3b).
      # Verified on every container start; see guardian/entrypoint.sh.
      GUARDIAN_MODEL_SHA256: "${GUARDIAN_MODEL_SHA256:-21e4d79c7a7399182182222636e44fc189947e1ac8c324dda93205d5769c4344}"
      GUARDIAN_THREADS: "${GUARDIAN_THREADS:-4}"
      GUARDIAN_CTX_SIZE: "${GUARDIAN_CTX_SIZE:-4096}"
    volumes:
      # Weights are mounted, never baked into the image: multi-gigabyte layers
      # are wasteful, and a read-only mount plus a start-time hash check gives
      # the same integrity guarantee.
      - ./models:/models:ro
    expose: ["8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: ${GUARDIAN_MEM_LIMIT:-4g}
    pids_limit: 128

  cleanerproxy:
    build: .
    restart: unless-stopped
    # Both networks: egress to reach the (untrusted) upstream provider,
    # classifier to reach the guardian.
    networks: [egress, classifier]
    depends_on:
      guardian:
        condition: service_healthy
    environment:
      # The upstream being inspected. Point this at whatever relay you do not
      # trust; the whole pipeline assumes this host may be hostile.
      CLEANERPROXY_ANTHROPIC_UPSTREAM: ${CLEANERPROXY_ANTHROPIC_UPSTREAM:-https://api.anthropic.com}
      # "off" disables the API entirely (501 rather than a forward). Prefer that
      # over a default URL for any surface you are not actually using.
      CLEANERPROXY_OPENAI_UPSTREAM: ${CLEANERPROXY_OPENAI_UPSTREAM:-off}

      # defang | strict | abort-on-proof | abort-all | monitor
      # Start on `monitor` against real traffic to measure the false-positive
      # rate, then move to `defang` once you trust it.
      CLEANERPROXY_POLICY: ${CLEANERPROXY_POLICY:-defang}

      # Tier 2. The guardian backend runs locally, so no conversation content
      # leaves the machine to answer "should this tool call be allowed?".
      CLEANERPROXY_CLASSIFIER_ENABLED: ${CLEANERPROXY_CLASSIFIER_ENABLED:-true}
      CLEANERPROXY_CLASSIFIER_BACKEND: guardian
      CLEANERPROXY_CLASSIFIER_BASE_URL: http://guardian:8080
      # function_call is the model's own trained criterion and measured best
      # on internal/evalset (AUC 0.986). A hand-written custom criterion
      # scored materially worse (0.897) - do not change without re-measuring
      # via cmd/guardian-eval.
      CLEANERPROXY_GUARDIAN_VARIANT: ${CLEANERPROXY_GUARDIAN_VARIANT:-function_call}
      CLEANERPROXY_SEMANTIC_BLOCK_CONFIDENCE: ${CLEANERPROXY_SEMANTIC_BLOCK_CONFIDENCE:-0.7}
      CLEANERPROXY_CLASSIFY_ALL: ${CLEANERPROXY_CLASSIFY_ALL:-false}

      # Lets a confident "this is relevant" judgment downgrade a Tier 1
      # dangerous-capability block. Off by default: it fixes real false
      # positives on actions you explicitly asked for, but allows a
      # probabilistic tier to overrule a deterministic one. See the comment on
      # Guard.VouchEnabled before turning this on.
      CLEANERPROXY_VOUCH_ENABLED: ${CLEANERPROXY_VOUCH_ENABLED:-false}

      # Human-in-the-loop approval. A blocked call is replaced by a question
      # asked through the client's own question tool, so a false positive costs
      # one keystroke instead of a restart in monitor mode. Without it, Tier 1
      # blocks are unrecoverable: those rules ignore conversation context by
      # design, so re-requesting reproduces the same block forever.
      CLEANERPROXY_APPROVAL_ENABLED: ${CLEANERPROXY_APPROVAL_ENABLED:-true}
      CLEANERPROXY_APPROVAL_CHALLENGE_TTL: ${CLEANERPROXY_APPROVAL_CHALLENGE_TTL:-10m}
      CLEANERPROXY_APPROVAL_GRANT_TTL: ${CLEANERPROXY_APPROVAL_GRANT_TTL:-5m}
      # Client tool names usable for asking. Empty uses the built-in list,
      # which includes opencode's "question".
      CLEANERPROXY_APPROVAL_ASK_TOOLS: ${CLEANERPROXY_APPROVAL_ASK_TOOLS:-}

      # 64 hex chars enables AES-256-GCM on the audit log at rest.
      # Generate with: openssl rand -hex 32
      CLEANERPROXY_AUDIT_KEY: ${CLEANERPROXY_AUDIT_KEY:-}
      CLEANERPROXY_AUDIT_PATH: /var/lib/cleanerproxy/audit.log
    volumes:
      - audit:/var/lib/cleanerproxy
    # Published directly. nginx is opt-in (profile: tls) because the client
    # talks plain HTTP to this port.
    #
    # BIND_ADDR is the security boundary here. On 127.0.0.1 only this host can
    # reach it. Anything wider exposes an endpoint that forwards whatever
    # Authorization header it is given to the provider, so it must sit behind a
    # firewall, a private network, Tailscale, or an SSH tunnel — the request
    # carries a bearer token in cleartext.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8787:8787"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  # TLS front end. Opt in with: docker compose --profile tls up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: [tls]
    restart: unless-stopped
    networks: [egress]
    depends_on: [cleanerproxy]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8443:8443"
    volumes:
      - ./nginx/cleanerproxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt: [no-new-privileges:true]

networks:
  egress:
  classifier:
    internal: true

volumes:
  audit:
